apiVersion: v1
kind: Namespace
metadata:
  name: pr-preview-456
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app-pr456
  namespace: pr-preview-456
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend-app-pr456 }
  template:
    metadata:
      labels: { app: frontend-app-pr456 }
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      volumes:
      - name: site
        configMap:
          name: frontend-app-pr456-html
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-app-pr456-svc
  namespace: pr-preview-456
spec:
  selector: { app: frontend-app-pr456 }
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30199
